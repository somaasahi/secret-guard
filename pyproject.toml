[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "secret-guard"
version = "0.1.0"
description = "Block API keys before they are committed, and audit secrets readable by AI coding agents."
requires-python = ">=3.9"
dependencies = []

[project.scripts]
secret-guard = "secret_guard.cli:main"

[tool.setuptools]
packages = ["secret_guard"]
